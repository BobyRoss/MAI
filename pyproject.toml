[project]
name = "mai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bobby Ross", email = "sogo.rush@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mahjong",
]

[project.scripts]
mai = "mai:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "mahjong",
]

[tool.uv.sources]
mahjong = { workspace = true, editable = true }
